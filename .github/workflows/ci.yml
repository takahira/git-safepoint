name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (${{ matrix.os }}, py ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # 3.9 covers the pyproject lower bound; 3.14 covers the current line.
      # POSIX/FS-dependent behavior (flock, inode, exec-bit, symlink) is also
      # verified on macOS (review O). macOS runs the current Python only
      # (avoids provisioning 3.9 on arm64).
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      # Standard library only, zero dependencies. Discovering from the repo
      # root resolves the package imports.
      - name: unittest
        run: python -m unittest discover -s tests -p "test_*.py" -t .
